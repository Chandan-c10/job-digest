name: Job Digest

on:
  # This template ships with the schedule disabled. After you fork this and
  # add JOB_DIGEST_EMAIL / JOB_DIGEST_APP_PASSWORD / (optionally)
  # JOB_DIGEST_RECIPIENT as repo secrets, uncomment the schedule block below.
  #
  # GitHub Actions cron is UTC-only (no timezone setting) - convert your
  # target local time to UTC (README's "Timezone handling" has a full
  # IST->UTC lookup table) and edit the cron line(s) below. The example
  # here fires twice a day: 03:07 UTC and 12:53 UTC (~08:37 and ~06:23 PM
  # IST) - add/remove `- cron:` lines for however many times a day you want
  # it to run. Each of these is an "official" run: email + the full
  # Telegram digest to scheduled/queue subscribers.
  #
  # Deliberately NOT on :00/:30 - GitHub's scheduler is most congested at
  # the top/bottom of the hour (everyone else's cron jobs fire there too),
  # which can delay a run by hours. Keep any custom minute off
  # :00/:15/:30/:45 for the same reason.
  # schedule:
  #   - cron: "7 3 * * *"
  #   - cron: "53 12 * * *"
  #   # Optional: an hourly discovery-only trigger for Telegram instant/queue
  #   # mode (see README's "Notification modes"). Never sends email, never
  #   # runs the official digest - just finds new jobs and pings
  #   # instant/queue subscribers faster than the official times above.
  #   # Safe to omit if you don't use those modes. Must not land on the
  #   # same minute as an official cron line above (here it doesn't).
  #   - cron: "41 * * * *"
  workflow_dispatch: {}

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # seen_jobs.json, telegram_state.json, and pending_jobs.json persist
      # across runs via cache (not committed to the repo): seen_jobs.json so
      # the digest only ever emails genuinely new postings, telegram_state.
      # json so subscriber preferences carry over, and pending_jobs.json so
      # jobs found by an hourly discovery run (if you enabled it above)
      # aren't lost before the next official run flushes them.
      - uses: actions/cache@v4
        with:
          path: |
            seen_jobs.json
            telegram_state.json
            pending_jobs.json
          key: seen-jobs-${{ github.run_id }}
          restore-keys: |
            seen-jobs-

      - name: Run job digest
        env:
          JOB_DIGEST_EMAIL: ${{ secrets.JOB_DIGEST_EMAIL }}
          JOB_DIGEST_APP_PASSWORD: ${{ secrets.JOB_DIGEST_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # False only if you enabled the hourly discovery-only trigger
          # above; true for every official schedule time and for manual
          # workflow_dispatch runs (github.event.schedule is empty there,
          # so != '41 * * * *'). Harmless to leave in even if you never
          # enable the hourly trigger. Update the compared string if you
          # change the hourly trigger's own minute.
          TELEGRAM_OFFICIAL_RUN: ${{ github.event.schedule != '41 * * * *' }}
        run: python3 main.py
