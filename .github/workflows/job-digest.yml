name: Job Digest

on:
  # This template ships with the schedule disabled. After you fork this and
  # add JOB_DIGEST_EMAIL / JOB_DIGEST_APP_PASSWORD / (optionally)
  # JOB_DIGEST_RECIPIENT as repo secrets, uncomment the schedule block below.
  #
  # GitHub Actions cron is UTC-only (no timezone setting) - convert your
  # target local time to UTC by hand and edit the cron line(s) below. The
  # example here fires twice a day: 03:30 UTC and 12:30 UTC (09:00 and
  # 18:00 IST) - add/remove `- cron:` lines for however many times a day
  # you want it to run.
  # schedule:
  #   - cron: "30 3 * * *"
  #   - cron: "30 12 * * *"
  workflow_dispatch: {}

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # seen_jobs.json and telegram_state.json persist across runs via cache
      # (not committed to the repo) so the digest only ever emails genuinely
      # new postings, and Telegram subscriber preferences carry over.
      - uses: actions/cache@v4
        with:
          path: |
            seen_jobs.json
            telegram_state.json
          key: seen-jobs-${{ github.run_id }}
          restore-keys: |
            seen-jobs-

      - name: Run job digest
        env:
          JOB_DIGEST_EMAIL: ${{ secrets.JOB_DIGEST_EMAIL }}
          JOB_DIGEST_APP_PASSWORD: ${{ secrets.JOB_DIGEST_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 main.py
