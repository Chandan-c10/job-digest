name: Job Digest

on:
  # This template ships with the schedule disabled. After you fork this and
  # add JOB_DIGEST_EMAIL / JOB_DIGEST_APP_PASSWORD / (optionally)
  # JOB_DIGEST_RECIPIENT as repo secrets, uncomment the schedule block below.
  #
  # Just ONE fixed recurring check - hourly, off the top of the hour
  # (GitHub's scheduler is most congested at :00/:30, which can delay a
  # run by hours). You'll basically never need to touch this line: your
  # actual times live entirely in config.py's EMAIL_SCHEDULE_IST /
  # TELEGRAM_INTERVAL_HOURS (or TELEGRAM_SCHEDULE_IST) - schedule.py
  # checks "now" against those every time this fires, and only sends
  # email/Telegram when a configured slot is actually due. See README's
  # "Where it runs" for why the workflow can't just read config.py's times
  # directly (GitHub's scheduler runs independently of your Python code).
  # schedule:
  #   - cron: "17 * * * *"
  workflow_dispatch: {}

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # State persists across runs via cache (not committed to the repo):
      # seen_jobs.json so the digest only ever considers genuinely new
      # postings, telegram_state.json so subscriber preferences carry
      # over, pending_email_jobs.json/pending_telegram_jobs.json so jobs
      # found between scheduled sends aren't lost, and schedule_state.json
      # so each configured time fires at most once a day.
      - uses: actions/cache@v4
        with:
          path: |
            seen_jobs.json
            telegram_state.json
            pending_email_jobs.json
            pending_telegram_jobs.json
            schedule_state.json
          # run_attempt (not just run_id) so clicking "Re-run jobs" on an
          # existing run gets its own fresh cache key too - otherwise the
          # save step silently no-ops on a key collision and that re-run's
          # state changes are lost.
          key: seen-jobs-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            seen-jobs-

      - name: Run job digest
        env:
          JOB_DIGEST_EMAIL: ${{ secrets.JOB_DIGEST_EMAIL }}
          JOB_DIGEST_APP_PASSWORD: ${{ secrets.JOB_DIGEST_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 main.py
